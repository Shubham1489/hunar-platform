# ──────────────────────────────────────────────
# Hunar Platform — Full Production Stack
# Usage: docker compose -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────

services:
  # ─── PostgreSQL 15 with pgvector ──────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: hunar_postgres
    restart: always
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-hunar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hunar_secret}
      POSTGRES_DB: ${DB_NAME:-hunar_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-hunar} -d ${DB_NAME:-hunar_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hunar-net

  # ─── Redis 7 ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hunar_redis
    restart: always
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hunar-net

  # ─── Hunar API (Node.js / Fastify) ──────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: hunar_api
    restart: always
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-hunar}:${DB_PASSWORD:-hunar_secret}@postgres:5432/${DB_NAME:-hunar_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-24h}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hunar-net

  # ─── Hunar AI Service (Python / FastAPI) ────
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: hunar_ai
    restart: always
    ports:
      - '${AI_PORT:-8000}:8000'
    environment:
      PYTHONUNBUFFERED: 1
      AI_SERVICE_PORT: 8000
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - hunar-net

  # ─── Hunar Web (Next.js) ────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    container_name: hunar_web
    restart: always
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hunar-net

  # ─── Nginx Reverse Proxy ────────────────────
  nginx:
    image: nginx:alpine
    container_name: hunar_nginx
    restart: always
    ports:
      - '${NGINX_PORT:-80}:80'
      - '${NGINX_SSL_PORT:-443}:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks:
      - hunar-net

  # ─── DB Migrations (run once on deploy) ─────
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: hunar_migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-hunar}:${DB_PASSWORD:-hunar_secret}@postgres:5432/${DB_NAME:-hunar_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - hunar-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  hunar-net:
    driver: bridge
