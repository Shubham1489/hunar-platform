<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Area -->
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md">
<!-- Shared Component: TopAppBar -->
<div class="flex items-center px-4 h-16 gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-lg font-bold text-on-surface">Register</h1>
</div>
<!-- Shared Component: ProgressBar (Updated to Step 2 context but using JSON structure logic) -->
<div class="px-6 pb-4">
<div class="flex justify-between items-center mb-2">
<span class="text-xs font-semibold text-on-surface-variant tracking-wider uppercase">Registration Progress</span>
<span class="text-xs font-bold text-primary">Step 2 of 2</span>
</div>
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500" style="width: 100%;"></div>
</div>
</div>
</header>
<main class="flex-1 px-6 pt-4 pb-32">
<!-- Hero Branding Section -->
<div class="mb-8 relative">
<div class="absolute -top-4 -left-4 w-24 h-24 bg-secondary/10 rounded-full blur-3xl"></div>
<p class="font-label text-xs font-bold text-secondary uppercase tracking-widest mb-2">Personalize Your Feed</p>
<h2 class="font-headline text-3xl font-extrabold text-on-surface leading-tight mb-3">What are you interested in?</h2>
<p class="text-on-surface-variant text-sm leading-relaxed max-w-[280px]">Select at least 3 categories to help us find the best artisans for your needs.</p>
</div>
<!-- Bento Grid for Categories -->
<div class="grid grid-cols-2 gap-4">
<!-- Category Card: Electrician -->
<button class="relative group text-left overflow-hidden bg-surface-container-lowest rounded-xl p-5 border-2 border-transparent hover:border-primary transition-all duration-300 shadow-sm">
<div class="w-12 h-12 rounded-lg bg-primary/5 flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="bolt">bolt</span>
</div>
<p class="font-headline font-bold text-on-surface group-hover:text-primary transition-colors">Electrician</p>
<p class="text-[10px] text-on-surface-variant mt-1">Wiring, repairs &amp; installs</p>
<div class="absolute top-3 right-3 opacity-0 group-focus:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Category Card: AC Repair -->
<button class="relative group text-left overflow-hidden bg-surface-container-lowest rounded-xl p-5 border-2 border-transparent hover:border-primary transition-all duration-300 shadow-sm">
<div class="w-12 h-12 rounded-lg bg-primary/5 flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="ac_unit">ac_unit</span>
</div>
<p class="font-headline font-bold text-on-surface group-hover:text-primary transition-colors">AC Repair</p>
<p class="text-[10px] text-on-surface-variant mt-1">Cooling &amp; ventilation</p>
</button>
<!-- Category Card: Plumbing (Large Visual Treatment) -->
<button class="relative group col-span-2 text-left overflow-hidden bg-surface-container-lowest rounded-xl p-6 border-2 border-transparent hover:border-primary transition-all duration-300 shadow-sm flex items-center gap-6">
<div class="w-16 h-16 rounded-full bg-primary/5 flex items-center justify-center group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-3xl" data-icon="water_drop">water_drop</span>
</div>
<div class="flex-1">
<p class="font-headline font-bold text-lg text-on-surface group-hover:text-primary transition-colors">Plumbing</p>
<p class="text-xs text-on-surface-variant">Leak fixes, pipes &amp; drainage solutions</p>
</div>
</button>
<!-- Category Card: Carpentry -->
<button class="relative group text-left overflow-hidden bg-surface-container-lowest rounded-xl p-5 border-2 border-transparent hover:border-primary transition-all duration-300 shadow-sm">
<div class="w-12 h-12 rounded-lg bg-primary/5 flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="carpenter">carpenter</span>
</div>
<p class="font-headline font-bold text-on-surface group-hover:text-primary transition-colors">Carpentry</p>
<p class="text-[10px] text-on-surface-variant mt-1">Furniture &amp; wood works</p>
</button>
<!-- Category Card: Cleaning -->
<button class="relative group text-left overflow-hidden bg-surface-container-lowest rounded-xl p-5 border-2 border-transparent hover:border-primary transition-all duration-300 shadow-sm">
<div class="w-12 h-12 rounded-lg bg-primary/5 flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="cleaning_services">cleaning_services</span>
</div>
<p class="font-headline font-bold text-on-surface group-hover:text-primary transition-colors">Cleaning</p>
<p class="text-[10px] text-on-surface-variant mt-1">Home &amp; office hygiene</p>
</button>
<!-- Category Card: Painting -->
<button class="relative group text-left overflow-hidden bg-surface-container-lowest rounded-xl p-5 border-2 border-transparent hover:border-primary transition-all duration-300 shadow-sm">
<div class="w-12 h-12 rounded-lg bg-primary/5 flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="format_paint">format_paint</span>
</div>
<p class="font-headline font-bold text-on-surface group-hover:text-primary transition-colors">Painting</p>
<p class="text-[10px] text-on-surface-variant mt-1">Interior &amp; exterior coats</p>
</button>
<!-- Category Card: Landscaping -->
<button class="relative group text-left overflow-hidden bg-surface-container-lowest rounded-xl p-5 border-2 border-transparent hover:border-primary transition-all duration-300 shadow-sm">
<div class="w-12 h-12 rounded-lg bg-primary/5 flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="grass">grass</span>

<p class="text-[10px] text-on-surface-variant mt-1">Gardening &amp; outdoors</p>
</button>
</div>
<div class="mt-8 p-6 rounded-2xl bg-secondary-container/10 border border-secondary/10 flex items-start gap-4">
<span class="material-symbols-outlined text-secondary" data-icon="lightbulb" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<div>
<p class="font-bold text-sm text-on-secondary-container">Pro Tip</p>
<p class="text-xs text-on-surface-variant leading-relaxed">You can always update your preferences in your profile settings later.</p>
</div>
</div>

<div class="flex flex-col gap-3">
<!-- Hierarchy: Primary -->
<button class="w-full h-[52px] signature-gradient text-on-primary rounded-xl font-headline font-bold text-base shadow-lg shadow-primary/20 flex items-center justify-center gap-2">

</button>
<!-- Hierarchy: Secondary -->
<button class="w-full h-[52px] bg-transparent text-primary rounded-xl font-headline font-bold text-base border border-primary/20 hover:bg-surface-container-low transition-colors">

</div>
