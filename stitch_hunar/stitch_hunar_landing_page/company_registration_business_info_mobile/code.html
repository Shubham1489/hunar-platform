<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-bright": "#f6fafe",
                        "on-primary-fixed": "#00164e",
                        "on-tertiary-container": "#4ebdb0",
                        "on-surface-variant": "#444651",
                        "secondary-container": "#fd761a",
                        "primary-fixed-dim": "#b6c4ff",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#264191",
                        "surface-dim": "#d6dade",
                        "inverse-on-surface": "#edf1f5",
                        "surface-variant": "#dfe3e7",
                        "surface-container": "#eaeef2",
                        "inverse-surface": "#2c3134",
                        "tertiary-container": "#004942",
                        "primary-container": "#1e3a8a",
                        "on-background": "#171c1f",
                        "tertiary": "#00312c",
                        "on-error": "#ffffff",
                        "surface-tint": "#4059aa",
                        "on-surface": "#171c1f",
                        "surface": "#f6fafe",
                        "primary-fixed": "#dce1ff",
                        "secondary-fixed-dim": "#ffb690",
                        "surface-container-low": "#f0f4f8",
                        "on-primary-container": "#90a8ff",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#6bd8cb",
                        "secondary": "#9d4300",
                        "on-secondary-container": "#5c2400",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#dfe3e7",
                        "on-secondary-fixed": "#341100",
                        "secondary-fixed": "#ffdbca",
                        "inverse-primary": "#b6c4ff",
                        "on-tertiary-fixed-variant": "#005049",
                        "outline": "#757682",
                        "primary": "#00236f",
                        "on-secondary-fixed-variant": "#783200",
                        "tertiary-fixed": "#89f5e7",
                        "surface-container-high": "#e4e9ed",
                        "on-tertiary-fixed": "#00201d",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c5c5d3",
                        "background": "#f6fafe",
                        "error-container": "#ffdad6"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f6fafe;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .premium-gradient {
            background: linear-gradient(135deg, #00236f 0%, #1e3a8a 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<nav class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md px-4 h-16 flex items-center justify-between">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-xl font-bold text-on-surface">Register</h1>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</nav>
<!-- ProgressBar -->
<div class="px-6 py-4 bg-surface">
<div class="flex justify-between items-end mb-2">
<span class="text-label font-semibold text-xs uppercase tracking-wider text-primary">Registration Progress</span>
<span class="text-label font-bold text-sm text-on-surface-variant">Step 1 of 3</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 33%"></div>
</div>
</div>
<!-- Main Content (Creative Canvas) -->
<main class="flex-grow px-6 pt-4 pb-32">
<!-- Editorial Header -->
<header class="mb-10">
<div class="inline-block px-3 py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed text-[10px] font-bold uppercase tracking-widest mb-3">
                Company Setup
            </div>
<h2 class="font-headline text-4xl font-extrabold text-on-surface leading-tight tracking-tight">
                Tell us about your <span class="text-primary">Business.</span>
</h2>
<p class="mt-4 text-on-surface-variant text-body-md leading-relaxed max-w-[280px]">
                Create your professional artisan profile to start sourcing top-tier talent.
            </p>
</header>
<!-- Form Section with Tonal Layering -->
<div class="space-y-6">
<!-- Company Name Field -->
<div class="group">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2 ml-1">Company Name</label>
<div class="relative">
<input class="w-full h-14 px-5 rounded-xl border-0 bg-surface-container-lowest shadow-[0px_12px_32px_rgba(23,28,31,0.04)] text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary transition-all" placeholder="e.g. Artisan Build Co." type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary/20">
<span class="material-symbols-outlined" data-icon="business">business</span>
</div>
</div>
</div>
<!-- Contact Person Field -->
<div class="group">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2 ml-1">Contact Person</label>
<div class="relative">
<input class="w-full h-14 px-5 rounded-xl border-0 bg-surface-container-lowest shadow-[0px_12px_32px_rgba(23,28,31,0.04)] text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary transition-all" placeholder="Full name" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary/20">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
</div>
</div>
<!-- Business Category Grid (Bento Style) -->
<div>
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-3 ml-1">Business Category</label>
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-start p-4 rounded-xl bg-primary text-on-primary shadow-lg transition-all text-left">
<span class="material-symbols-outlined mb-2" data-icon="construction" style="font-variation-settings: 'FILL' 1;">construction</span>
<span class="text-sm font-bold">Construction</span>
</button>
<button class="flex flex-col items-start p-4 rounded-xl bg-surface-container-lowest text-on-surface shadow-[0px_12px_32px_rgba(23,28,31,0.04)] transition-all text-left border-2 border-transparent hover:border-primary-fixed">
<span class="material-symbols-outlined mb-2 text-primary" data-icon="settings">settings</span>
<span class="text-sm font-bold">Manufacturing</span>
</button>
<button class="flex flex-col items-start p-4 rounded-xl bg-surface-container-lowest text-on-surface shadow-[0px_12px_32px_rgba(23,28,31,0.04)] transition-all text-left border-2 border-transparent hover:border-primary-fixed">
<span class="material-symbols-outlined mb-2 text-primary" data-icon="bolt">bolt</span>
<span class="text-sm font-bold">Electrical</span>
</button>
<button class="flex flex-col items-start p-4 rounded-xl bg-surface-container-lowest text-on-surface shadow-[0px_12px_32px_rgba(23,28,31,0.04)] transition-all text-left border-2 border-transparent hover:border-primary-fixed">
<span class="material-symbols-outlined mb-2 text-primary" data-icon="more_horiz">more_horiz</span>
<span class="text-sm font-bold">Other Trade</span>
</button>
</div>
</div>
</div>
<!-- Visual Anchor (Asymmetric Decoration) -->
<div class="mt-12 relative h-32 rounded-xl premium-gradient overflow-hidden flex items-center p-6 shadow-xl">
<div class="relative z-10">
<h4 class="text-on-primary font-headline font-bold text-lg">Verification Ready?</h4>
<p class="text-primary-fixed text-xs mt-1">Have your business license handy for the next step.</p>
</div>
<div class="absolute -right-4 -bottom-4 opacity-20">
<span class="material-symbols-outlined text-[120px]" data-icon="verified_user">verified_user</span>
</div>
</div>
</main>
<!-- PushToBottom & ButtonGroup -->
<div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-surface via-surface to-transparent">
<div class="flex flex-col gap-3 max-w-md mx-auto">
<button class="w-full h-[52px] rounded-xl premium-gradient text-on-primary font-bold text-base shadow-[0px_12px_32px_rgba(0,35,111,0.2)] active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full h-[52px] rounded-xl bg-transparent text-primary font-bold text-base hover:bg-primary/5 transition-colors">
                Back
            </button>
</div>
</div>
</body></html>
