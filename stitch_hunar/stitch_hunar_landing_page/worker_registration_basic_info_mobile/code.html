<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-bright": "#f6fafe",
                        "on-primary-fixed": "#00164e",
                        "on-tertiary-container": "#4ebdb0",
                        "on-surface-variant": "#444651",
                        "secondary-container": "#fd761a",
                        "primary-fixed-dim": "#b6c4ff",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#264191",
                        "surface-dim": "#d6dade",
                        "inverse-on-surface": "#edf1f5",
                        "surface-variant": "#dfe3e7",
                        "surface-container": "#eaeef2",
                        "inverse-surface": "#2c3134",
                        "tertiary-container": "#004942",
                        "primary-container": "#1e3a8a",
                        "on-background": "#171c1f",
                        "tertiary": "#00312c",
                        "on-error": "#ffffff",
                        "surface-tint": "#4059aa",
                        "on-surface": "#171c1f",
                        "surface": "#f6fafe",
                        "primary-fixed": "#dce1ff",
                        "secondary-fixed-dim": "#ffb690",
                        "surface-container-low": "#f0f4f8",
                        "on-primary-container": "#90a8ff",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#6bd8cb",
                        "secondary": "#9d4300",
                        "on-secondary-container": "#5c2400",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#dfe3e7",
                        "on-secondary-fixed": "#341100",
                        "secondary-fixed": "#ffdbca",
                        "inverse-primary": "#b6c4ff",
                        "on-tertiary-fixed-variant": "#005049",
                        "outline": "#757682",
                        "primary": "#00236f",
                        "on-secondary-fixed-variant": "#783200",
                        "tertiary-fixed": "#89f5e7",
                        "surface-container-high": "#e4e9ed",
                        "on-tertiary-fixed": "#00201d",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c5c5d3",
                        "background": "#f6fafe",
                        "error-container": "#ffdad6"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .signature-gradient {
            background: linear-gradient(135deg, #00236f 0%, #1e3a8a 100%);
        }
        .ambient-shadow {
            box-shadow: 0px 12px 32px rgba(23, 28, 31, 0.06);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 px-4 h-16 flex items-center bg-surface/80 backdrop-blur-md">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-2 font-headline font-bold text-xl text-on-surface">Register</h1>
</header>
<main class="flex-grow px-6 pt-4 pb-32">
<!-- Progress Section -->
<div class="mb-10">
<div class="flex justify-between items-end mb-3">
<div class="flex flex-col">
<span class="text-[10px] uppercase tracking-widest font-bold text-secondary mb-1">Registration Progress</span>
<h2 class="font-headline font-extrabold text-2xl">Basic Info</h2>
</div>
<span class="font-headline font-bold text-primary text-sm">Step 1 of 3</span>
</div>
<!-- ProgressBar -->
<div class="h-3 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full signature-gradient rounded-full" style="width: 33%"></div>
</div>
</div>
<!-- Form Area -->
<div class="space-y-8">
<div class="relative group">
<label class="absolute -top-2.5 left-4 px-1 bg-surface text-xs font-semibold text-outline group-focus-within:text-primary transition-colors">Full Name</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl p-4 ambient-shadow ring-1 ring-outline-variant/20 focus-within:ring-primary/50 transition-all">
<span class="material-symbols-outlined mr-3 text-outline" data-icon="person">person</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline-variant p-0" placeholder="John Doe" type="text"/>
</div>
</div>
<div class="relative group">
<label class="absolute -top-2.5 left-4 px-1 bg-surface text-xs font-semibold text-outline group-focus-within:text-primary transition-colors">Phone Number</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl p-4 ambient-shadow ring-1 ring-outline-variant/20 focus-within:ring-primary/50 transition-all">
<span class="material-symbols-outlined mr-3 text-outline" data-icon="call">call</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline-variant p-0" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<div class="relative group">
<label class="absolute -top-2.5 left-4 px-1 bg-surface text-xs font-semibold text-outline group-focus-within:text-primary transition-colors">City</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl p-4 ambient-shadow ring-1 ring-outline-variant/20 focus-within:ring-primary/50 transition-all">
<span class="material-symbols-outlined mr-3 text-outline" data-icon="location_on">location_on</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline-variant p-0" placeholder="e.g. New York" type="text"/>
</div>
</div>
<!-- Visual Decorative Card (Asymmetric Layout) -->
<div class="mt-12 relative">
<div class="absolute -top-4 -right-2 w-24 h-24 bg-secondary-fixed opacity-20 rounded-full blur-2xl"></div>
<div class="glass-card rounded-xl p-6 border border-white/40 ambient-shadow relative overflow-hidden">
<div class="flex items-start gap-4">
<div class="w-12 h-12 rounded-lg bg-tertiary/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-tertiary" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
<div>
<h4 class="font-headline font-bold text-on-surface leading-tight">Your Privacy Matters</h4>
<p class="text-sm text-on-surface-variant mt-1 leading-relaxed">We only use your info to find local job matches near you.</p>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- PushToBottom & ButtonGroup -->
<footer class="fixed bottom-0 left-0 right-0 p-6 bg-surface/90 backdrop-blur-md">
<div class="flex flex-col gap-3 max-w-md mx-auto">
<button class="w-full h-[52px] signature-gradient text-on-primary font-headline font-bold rounded-xl ambient-shadow hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full h-[52px] bg-transparent text-primary font-headline font-semibold rounded-xl border-none hover:bg-primary/5 transition-colors">
                Back
            </button>
</div>
</footer>
</body></html>
